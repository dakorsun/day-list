<form class="tracker-form" [formGroup]="cutForm">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Enter your last business </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field class="w-full">
        <mat-label>What's up</mat-label>
        <input
          matInput
          type="text"
          id="cut"
          placeholder="Cut"
          [formControl]="cutInput"
        />
      </mat-form-field>
    </mat-card-content>
    <mat-card-footer class="p-4">
      <button
        matButton="filled"
        type="submit"
        class="px-2 md:px-4 lg:px-6 py-2"
        [disabled]="cutForm.invalid"
      >
        Cut
      </button>
    </mat-card-footer>
  </mat-card>
</form>
